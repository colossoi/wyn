[package]
name = "wyn-egir-viz-wasm"
version = "0.3.0"
edition = "2021"
description = "WebAssembly snapshots for the Wyn EGIR pass visualizer"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wyn-core = { path = "../wyn-core", features = ["egir"] }
wyn-module-graph = { path = "../wyn-module-graph" }
wyn-staged-ir = { path = "../wyn-staged-ir" }
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1.0"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["console"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
# Egglog's random-number dependency uses the browser's Web Crypto API.
getrandom = { version = "0.3.4", features = ["wasm_js"] }

[profile.release]
opt-level = "s"
lto = true
