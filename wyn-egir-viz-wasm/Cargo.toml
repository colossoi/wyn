[package]
name = "wyn-egir-viz-wasm"
version = "0.3.0"
edition = "2021"
description = "WebAssembly snapshots for the Wyn EGIR pass visualizer"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wyn-core = { path = "../wyn-core" }
wyn-module-graph = { path = "../wyn-module-graph" }
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["console"] }

[profile.release]
opt-level = "s"
lto = true
