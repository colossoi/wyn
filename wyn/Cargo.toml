[package]
name = "wyn"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "wyn"
path = "src/main.rs"

[dependencies]
wyn-core = { path = "../wyn-core" }
wyn-diagnostics = { path = "../wyn-diagnostics" }
wyn-module-graph = { path = "../wyn-module-graph" }
wyn-package-manager = { path = "../wyn-package-manager" }
clap.workspace = true
thiserror.workspace = true
log.workspace = true
env_logger.workspace = true
toml = "0.8"

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
naga = { version = "27.0", features = ["wgsl-in", "spv-in", "spv-out"] }
wyn-host-interp = { path = "../wyn-host-interp" }
wspirv = { package = "wyn-spirv", path = "../wyn-spirv" }
