[package]
name = "wyn-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
egglog-engine = { package = "egglog", version = "3.0.0", default-features = false }
thiserror.workspace = true
nom.workspace = true
polytype.workspace = true
spirv.workspace = true
log.workspace = true
slotmap = "1.0"
smallvec = "1.13"
itertools = "0.14.0"
half = "2.7"
wyn-base = { path = "../wyn-base" }
wyn-host = { path = "../wyn-host" }
wyn-graph = { path = "../wyn-graph" }
wyn-module-graph = { path = "../wyn-module-graph" }
wspirv = { package = "wyn-spirv", path = "../wyn-spirv" }

[dev-dependencies]
wyn-host-interp = { path = "../wyn-host-interp" }
env_logger.workspace = true
stacker = "0.1.25"
# Used for in-process WGSL and SPIR-V validation in backend tests.
naga = { version = "26.0", features = ["wgsl-in", "spv-in"] }
